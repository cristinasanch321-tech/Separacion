<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Separación</title>
<style>
    :root { --panel-bg: #1e1e20; --btn-bg: #2a2b2e; --btn-bg-hover: #33343a; --btn-border: #3a3b3e; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--panel-bg); color: #eee; padding: 3px; margin: 0; }
    .titlebar { display: flex; justify-content: center; cursor: pointer; padding: 2px 0; border-radius: 5px; user-select: none; position: relative; }
    .titlebar:hover { background: var(--btn-bg); }
    .dots { color: #999; font-size: 14px; line-height: 1; }
    .pop { position: absolute; top: 22px; left: 3px; right: 3px; background: #232427; border: 1px solid #444; border-radius: 10px; padding: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.6); display: none; z-index: 50; }
    .pop.open { display: block; }
    .pop h4 { margin: 0 0 6px; text-align: center; font-size: 10px; color: #eee; }
    .srow { padding: 5px 0; border-top: 1px solid #2e2f33; }
    .slbl { display: block; font-size: 9px; color: #aaa; margin-bottom: 4px; }
    .seg { display: flex; gap: 2px; }
    .seg button { flex: 1; border: none; background: #1a1b1d; color: #8a8b90; font-size: 9px; padding: 4px 2px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .seg button.on { background: #3a3b40; color: #fff; }
    .grid { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 2px; padding-left: 2px; }
    .big { background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 5px; height: 17px; width: 25%; min-width: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .big:hover { background: var(--btn-bg-hover); }
    .big.disabled { opacity: .4; pointer-events: none; }
    .big .icon { font-size: 10px; line-height: 1; color: #bbb; }
    #status { margin-top: 2px; font-size: 8px; line-height: 1.2; color: #9aa; white-space: pre-wrap; word-break: break-word; max-height: 32px; overflow-y: auto; }
    #status.ok { color: #7ed957; } #status.err { color: #ff6b6b; }
</style>
</head>
<body>
    <div class="titlebar" id="titlebar">
        <span class="dots">⋮</span>
        <div class="pop" id="settingsPop">
            <h4>Settings</h4>
            <div class="srow">
                <span class="slbl">Track layout (reunir)</span>
                <div class="seg" data-key="layout">
                    <button data-v="squashed" class="on">Squashed</button>
                    <button data-v="perdevice">Per device</button>
                </div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="big" id="btnSpread" title="Separar selección (vídeo+audio)"><div class="icon">⏫</div></div>
        <div class="big" id="btnRestck" title="Reunir selección en cascada"><div class="icon">⏬</div></div>
        <div class="big" id="btnFitH" title="Llenar ALTURA del fotograma (proporcional)"><div class="icon">⬜</div></div>
        <div class="big" id="btnFitW" title="Llenar ANCHURA del fotograma (proporcional)"><div class="icon">▭</div></div>
    </div>
    <div id="status">...</div>

    <script src="./js/CSInterface.js"></script>
    <script>
        const cs = new CSInterface();
        const statusEl = document.getElementById('status');
        let SETTINGS = { layout: 'squashed' };
        let busy = false;

        (function () {
            try {
                const c = cs.getHostEnvironment().appSkinInfo.panelBackgroundColor.color;
                const cl = x => Math.max(0, Math.min(255, Math.round(x)));
                const rgb = (r, g, b) => `rgb(${cl(r)},${cl(g)},${cl(b)})`;
                const s = document.documentElement.style;
                s.setProperty('--panel-bg', rgb(c.red, c.green, c.blue));
                s.setProperty('--btn-bg', rgb(c.red + 16, c.green + 16, c.blue + 16));
                s.setProperty('--btn-bg-hover', rgb(c.red + 30, c.green + 30, c.blue + 30));
                s.setProperty('--btn-border', rgb(c.red + 16, c.green + 16, c.blue + 16));
            } catch (e) {}
        })();

        function setStatus(txt, cls) { statusEl.className = cls || ''; statusEl.innerText = txt || ''; }
        function setBusy(b) {
            busy = b;
            ['btnSpread','btnRestck','btnFitH','btnFitW'].forEach(id =>
                document.getElementById(id).classList.toggle('disabled', b));
        }

        const pop = document.getElementById('settingsPop');
        document.getElementById('titlebar').addEventListener('click', (e) => { e.stopPropagation(); pop.classList.toggle('open'); });
        document.addEventListener('click', (e) => { if (pop.classList.contains('open') && !pop.contains(e.target)) pop.classList.remove('open'); });
        document.querySelectorAll('.seg').forEach(seg => {
            seg.addEventListener('click', (e) => {
                const btn = e.target.closest('button'); if (!btn) return;
                seg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
                btn.classList.add('on');
                SETTINGS[seg.dataset.key] = btn.dataset.v;
                localStorage.setItem('separacion_settings', JSON.stringify(SETTINGS));
            });
        });
        try {
            const s = localStorage.getItem('separacion_settings');
            if (s) SETTINGS = Object.assign(SETTINGS, JSON.parse(s));
        } catch (e) {}
        document.querySelectorAll('.seg').forEach(seg => {
            const v = SETTINGS[seg.dataset.key];
            seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
        });

        cs.evalScript('SP_ping()', (res) => {
            try {
                const r = JSON.parse(res);
                setStatus(r.ok ? `"${r.seq}"` : `${r.error}`);
            } catch (e) { setStatus('JSX no cargado', 'err'); }
        });

        document.getElementById('btnSpread').addEventListener('click', () => {
            if (busy) return;
            setBusy(true);
            setStatus('Separando selección...');
            cs.evalScript('SP_spread()', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                setBusy(false);
                if (r && r.ok) {
                    let m = `✔ ${r.spread}V/${r.audio}A en pistas`;
                    if (r.addedTracks) m += ` (+${r.addedTracks} pistas)`;
                    m += '\nCmd+A → Clip > Synchronize → Audio\nLuego ⏬';
                    setStatus(m, 'ok');
                } else setStatus('Fallo:\n' + (r ? r.errors.join('\n') : res), 'err');
            });
        });

        document.getElementById('btnRestck').addEventListener('click', () => {
            if (busy) return;
            setBusy(true);
            setStatus('Reuniendo (' + SETTINGS.layout + ')...');
            cs.evalScript('SP_restack(' + JSON.stringify(JSON.stringify({ layout: SETTINGS.layout })) + ')', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                setBusy(false);
                if (r && r.ok) {
                    let m = `✔ ${r.stacked}V/${r.audio}A apilados`;
                    if (r.trimmed) m += ' · recorte al solape';
                    setStatus(m, 'ok');
                } else setStatus('Fallo:\n' + (r ? r.errors.join('\n') : res), 'err');
            });
        });

        // dimensiones desde cabecera: MP4/MOV (tkhd), PNG, JPG, GIF, BMP
        function fileDims(p) {
            const f2 = require('fs');
            const fd = f2.openSync(p, 'r');
            try {
                const hb = Buffer.alloc(64);
                f2.readSync(fd, hb, 0, 64, 0);
                // PNG
                if (hb[0] === 0x89 && hb.toString('ascii', 1, 4) === 'PNG')
                    return { w: hb.readUInt32BE(16), h: hb.readUInt32BE(20) };
                // GIF
                if (hb.toString('ascii', 0, 3) === 'GIF')
                    return { w: hb.readUInt16LE(6), h: hb.readUInt16LE(8) };
                // BMP
                if (hb[0] === 0x42 && hb[1] === 0x4D)
                    return { w: hb.readInt32LE(18), h: Math.abs(hb.readInt32LE(22)) };
                // JPG (busca marcador SOFn)
                if (hb[0] === 0xFF && hb[1] === 0xD8) {
                    let pos = 2, buf;
                    for (let guard = 0; guard < 64; guard++) {
                        if (f2.readSync(fd, hb, 0, 4, pos) < 4) break;
                        if (hb[0] !== 0xFF) break;
                        const marker = hb[1], len = hb.readUInt16BE(2);
                        if ((marker >= 0xC0 && marker <= 0xC3) || (marker >= 0xC5 && marker <= 0xC7) ||
                            (marker >= 0xC9 && marker <= 0xCB) || (marker >= 0xCD && marker <= 0xCF)) {
                            buf = Buffer.alloc(len);
                            f2.readSync(fd, buf, 0, len, pos);
                            return { h: buf.readUInt16BE(5), w: buf.readUInt16BE(7) };
                        }
                        pos += 2 + len;
                    }
                    return null;
                }
                // MP4/MOV: box tkhd
                const size = f2.fstatSync(fd).size;
                let dims = null;
                const CONT = { moov: 1, trak: 1, mdia: 1, minf: 1, stbl: 1, edts: 1 };
                function walk(pos, end, depth) {
                    if (dims || depth > 6) return;
                    let q = pos;
                    while (q + 8 <= end && !dims) {
                        if (f2.readSync(fd, hb, 0, 16, q) < 8) return;
                        let sz = hb.readUInt32BE(0);
                        const ty = hb.toString('ascii', 4, 8);
                        let hdr = 8;
                        if (sz === 1) { sz = Number(hb.readBigUInt64BE(8)); hdr = 16; }
                        if (sz < hdr) return;
                        if (ty === 'tkhd') {
                            const tail = Buffer.alloc(8);
                            f2.readSync(fd, tail, 0, 8, q + sz - 8);
                            const w = tail.readUInt32BE(0) / 65536;
                            const h = tail.readUInt32BE(4) / 65536;
                            if (w > 0 && h > 0) dims = { w: Math.round(w), h: Math.round(h) };
                            return;
                        }
                        if (CONT[ty]) walk(q + hdr, Math.min(q + sz, end), depth + 1);
                        q += sz;
                    }
                }
                walk(0, size, 0);
                return dims;
            } finally { f2.closeSync(fd); }
        }
        const mp4Dims = fileDims;
            const f2 = require('fs');
            const fd = f2.openSync(p, 'r');
            try {
                const size = f2.fstatSync(fd).size;
                let dims = null;
                const CONT = { moov: 1, trak: 1, mdia: 1, minf: 1, stbl: 1, edts: 1 };
                const hb = Buffer.alloc(16);
                function walk(pos, end, depth) {
                    if (dims || depth > 6) return;
                    let q = pos;
                    while (q + 8 <= end && !dims) {
                        if (f2.readSync(fd, hb, 0, 16, q) < 8) return;
                        let sz = hb.readUInt32BE(0);
                        const ty = hb.toString('ascii', 4, 8);
                        let hdr = 8;
                        if (sz === 1) { sz = Number(hb.readBigUInt64BE(8)); hdr = 16; }
                        if (sz < hdr) return;
                        if (ty === 'tkhd') {
                            const tail = Buffer.alloc(8);
                            f2.readSync(fd, tail, 0, 8, q + sz - 8);
                            const w = tail.readUInt32BE(0) / 65536;
                            const h = tail.readUInt32BE(4) / 65536;
                            if (w > 0 && h > 0) dims = { w: Math.round(w), h: Math.round(h) };
                            return;
                        }
                        if (CONT[ty]) walk(q + hdr, Math.min(q + sz, end), depth + 1);
                        q += sz;
                    }
                }
                walk(0, size, 0);
                return dims;
            } finally { f2.closeSync(fd); }
        }

        function runFit(mode) {
            if (busy) return;
            setBusy(true);
            setStatus('Leyendo selección y archivo...');
            cs.evalScript('SP_getSelMedia()', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                if (!r || !r.ok) { setStatus('Error: ' + (r ? r.error : res), 'err'); setBusy(false); return; }
                if (!r.clips.length) { setStatus('No hay clips seleccionados.', 'err'); setBusy(false); return; }
                let done = 0; const errs = [];
                const finish = () => {
                    setBusy(false);
                    if (done) setStatus('✔ ' + done + ' escalado(s), proporcional.' + (errs.length ? '\n' + errs.join('\n') : ''), errs.length ? 'err' : 'ok');
                    else setStatus('No escalado:\n' + errs.join('\n'), 'err');
                };
                r.clips.forEach((cl) => {
                    try {
                        if (!cl.path) { errs.push(cl.name + ': sin ruta de media'); return finishCheck(); }
                        const dims = fileDims(cl.path);
                        if (!dims) { errs.push(cl.name + ': formato sin dimensiones (soporto MP4/MOV/PNG/JPG/GIF/BMP)'); return finishCheck(); }
                        // escala ABSOLUTA deseada (% sobre el tamano nativo del media)
                        const wantAbs = (mode === 'height') ? (r.H / dims.h) * 100 : (r.W / dims.w) * 100;
                        // escala ACTUAL reportada por Premiere (puede incluir el auto-fit al insertar)
                        const curScale = cl.scale || 100;
                        // desvio relativo: cuanto hay que multiplicar lo ACTUAL para llegar al objetivo
                        const sc = Math.max(1, Math.min(20000, Math.round(curScale * wantAbs / 100 * 100) / 100));
                        cs.evalScript('SP_applyScaleToPath(' + JSON.stringify(cl.path) + ',' + sc + ')', (res2) => {
                            let r2 = null; try { r2 = JSON.parse(res2); } catch (e) {}
                            if (r2 && r2.ok) done++;
                            else errs.push(cl.name + ': ' + (r2 && r2.errors ? r2.errors.join('; ') : 'fallo'));
                            finishCheck();
                        });
                    } catch (e) { errs.push(cl.name + ': ' + e.message); finishCheck(); }
                    function finishCheck() { if (done + errs.length >= r.clips.length) finish(); }
                });
            });
        }
        document.getElementById('btnFitH').addEventListener('click', () => runFit('height'));
        document.getElementById('btnFitW').addEventListener('click', () => runFit('width'));
    </script>
</body>
</html>
