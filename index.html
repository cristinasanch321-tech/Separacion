<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Separación</title>
<style>
    :root { --panel-bg: #1e1e20; --btn-bg: #2a2b2e; --btn-bg-hover: #33343a; --btn-border: #3a3b3e; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--panel-bg); color: #eee; padding: 4px; margin: 0; }
    .titlebar { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 1px 3px; border-radius: 4px; user-select: none; position: relative; }
    .titlebar:hover { background: var(--btn-bg); }
    .tname { font-size: 11px; font-weight: 600; color: #ccc; }
    .dots { color: #888; font-size: 10px; }
    .pop { position: absolute; top: 20px; left: 0; width: 220px; background: #232427; border: 1px solid #444; border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 22px rgba(0,0,0,.55); display: none; z-index: 50; }
    .pop.open { display: block; }
    .pop h4 { margin: 0 0 6px; text-align: center; font-size: 11px; color: #eee; }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 0; }
    .slbl { font-size: 10px; color: #bbb; }
    .seg { display: flex; background: #1a1b1d; border-radius: 6px; padding: 2px; gap: 2px; }
    .seg button { border: none; background: transparent; color: #8a8b90; font-size: 9px; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .seg button.on { background: #3a3b40; color: #fff; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 4px; }
    .big { background: var(--btn-bg); border: 1px solid var(--btn-border); border-radius: 8px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .big:hover { background: var(--btn-bg-hover); }
    .big.disabled { opacity: .4; pointer-events: none; }
    .big .icon { font-size: 16px; color: #bbb; }
    #status { margin-top: 4px; font-size: 8px; color: #9aa; white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow-y: auto; }
    #status.ok { color: #7ed957; } #status.err { color: #ff6b6b; }
</style>
</head>
<body>
    <div class="titlebar" id="titlebar">
        <span class="tname">Separación</span>
        <span class="dots">⋮</span>
        <div class="pop" id="settingsPop">
            <h4>Settings</h4>
            <div class="srow">
                <span class="slbl">Track layout</span>
                <div class="seg" data-key="layout">
                    <button data-v="squashed" class="on">Squashed</button>
                    <button data-v="perdevice">Per device</button>
                </div>
            </div>
            <div class="srow">
                <span class="slbl" style="color:#77787c; font-size:9px;">Squashed: apila y recorta al solape común (listo p/ multicam). Per device: cada clip vuelve a su pista.</span>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="big" id="btnSpread" title="Separar: un clip por pista (vídeo+audio)"><div class="icon">⏫</div></div>
        <div class="big" id="btnRestck" title="Re-apilar en cascada"><div class="icon">⏬</div></div>
        <div class="big" id="btnFitH" title="Escalar selección para que la ALTURA llene el fotograma (proporcional)"><div class="icon">⬜</div></div>
        <div class="big" id="btnFitW" title="Escalar selección para que la ANCHURA llene el fotograma (proporcional)"><div class="icon">▭</div></div>
    </div>
    <div id="status">...</div>

    <script src="./js/CSInterface.js"></script>
    <script>
        const cs = new CSInterface();
        const statusEl = document.getElementById('status');
        let SETTINGS = { layout: 'squashed' };
        let busy = false;

        (function () {
            try {
                const c = cs.getHostEnvironment().appSkinInfo.panelBackgroundColor.color;
                const cl = x => Math.max(0, Math.min(255, Math.round(x)));
                const rgb = (r, g, b) => `rgb(${cl(r)},${cl(g)},${cl(b)})`;
                const s = document.documentElement.style;
                s.setProperty('--panel-bg', rgb(c.red, c.green, c.blue));
                s.setProperty('--btn-bg', rgb(c.red + 16, c.green + 16, c.blue + 16));
                s.setProperty('--btn-bg-hover', rgb(c.red + 30, c.green + 30, c.blue + 30));
                s.setProperty('--btn-border', rgb(c.red + 16, c.green + 16, c.blue + 16));
            } catch (e) {}
        })();

        function setStatus(txt, cls) { statusEl.className = cls || ''; statusEl.innerText = txt || ''; }
        function setBusy(b) {
            busy = b;
            document.getElementById('btnSpread').classList.toggle('disabled', b);
            document.getElementById('btnRestck').classList.toggle('disabled', b);
        }

        const pop = document.getElementById('settingsPop');
        document.getElementById('titlebar').addEventListener('click', (e) => { e.stopPropagation(); pop.classList.toggle('open'); });
        document.addEventListener('click', (e) => { if (pop.classList.contains('open') && !pop.contains(e.target)) pop.classList.remove('open'); });
        document.querySelectorAll('.seg').forEach(seg => {
            seg.addEventListener('click', (e) => {
                const btn = e.target.closest('button'); if (!btn) return;
                seg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
                btn.classList.add('on');
                SETTINGS[seg.dataset.key] = btn.dataset.v;
                localStorage.setItem('separacion_settings', JSON.stringify(SETTINGS));
            });
        });
        try {
            const s = localStorage.getItem('separacion_settings');
            if (s) SETTINGS = Object.assign(SETTINGS, JSON.parse(s));
        } catch (e) {}
        document.querySelectorAll('.seg').forEach(seg => {
            const v = SETTINGS[seg.dataset.key];
            seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
        });

        cs.evalScript('SP_ping()', (res) => {
            try {
                const r = JSON.parse(res);
                setStatus(r.ok ? `"${r.seq}" · ${r.videoTracks}V/${r.audioTracks}A` : `Premiere: ${r.error}`);
            } catch (e) { setStatus('JSX no cargado. Reinicia Premiere.', 'err'); }
        });

        document.getElementById('btnSpread').addEventListener('click', () => {
            if (busy) return;
            setBusy(true);
            setStatus('Separando selección...');
            cs.evalScript('SP_spread()', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                setBusy(false);
                if (r && r.ok) {
                    let m = `✔ ${r.spread} vídeo / ${r.audio} audio en pistas propias`;
                    if (r.addedTracks) m += ` · ${r.addedTracks} pistas creadas`;
                    m += '\nAhora: Cmd+A → Clip > Synchronize → Audio.\nCuando acabe, pulsa ⏬';
                    setStatus(m, 'ok');
                } else setStatus('Spread falló:\n' + (r ? r.errors.join('\n') : res), 'err');
            });
        });

        function runFit(mode) {
            if (busy) return;
            setBusy(true);
            setStatus(mode === 'height' ? 'Ajustando altura de la selección...' : 'Ajustando anchura de la selección...');
            cs.evalScript('SP_fitSelection(' + JSON.stringify(JSON.stringify({ mode: mode })) + ')', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                setBusy(false);
                if (r && r.ok && r.scaled > 0) setStatus('✔ ' + r.scaled + ' clip(s) escalados (proporcional, sin deformar).', 'ok');
                else setStatus('No escalado:
' + (r ? r.errors.join('\n') : res), 'err');
            });
        }
        document.getElementById('btnFitH').addEventListener('click', () => runFit('height'));
        document.getElementById('btnFitW').addEventListener('click', () => runFit('width'));

        document.getElementById('btnRestck').addEventListener('click', () => {
            if (busy) return;
            setBusy(true);
            setStatus('Reuniendo selección (' + SETTINGS.layout + ')...');
            cs.evalScript('SP_restack(' + JSON.stringify(JSON.stringify({ layout: SETTINGS.layout })) + ')', (res) => {
                let r = null; try { r = JSON.parse(res); } catch (e) {}
                setBusy(false);
                if (r && r.ok) {
                    let m = `✔ ${r.stacked} vídeo / ${r.audio} audio apilados`;
                    if (r.trimmed) m += ' · recortados al solape común';
                    if (r.addedTracks) m += ` · ${r.addedTracks} pistas creadas`;
                    setStatus(m, 'ok');
                } else setStatus('Re-stack falló:\n' + (r ? r.errors.join('\n') : res), 'err');
            });
        });
    </script>
</body>
</html>
